# Optional containerised services for Rekrea (not imported by the core package).
#
# Start:  docker compose -f services/docker-compose.yml up -d
# Stop:   docker compose -f services/docker-compose.yml down
#
# Requires Docker with NVIDIA GPU support (Docker Desktop + WSL2 integration works out of the box).

services:
  ollama:
    image: ollama/ollama:latest
    container_name: rekrea-ollama
    ports:
      - "127.0.0.1:11434:11434"      # localhost only
    volumes:
      - ollama_models:/root/.ollama  # downloaded models persist across restarts
    environment:
      # Unload the model from VRAM after this idle time so the GPU is free for other steps
      # (e.g. image generation). Raise it for snappier repeated calls.
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-2m}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  imagegen:
    build:
      context: ./imagegen
      args:
        # Leave empty for the default torch wheel. Set e.g. to
        # https://download.pytorch.org/whl/cu126 if CUDA fails to initialise in the container.
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-}
    container_name: rekrea-imagegen
    ports:
      - "127.0.0.1:8000:8000"        # localhost only
    volumes:
      - hf_cache:/root/.cache/huggingface   # downloaded model weights persist
    environment:
      # Hugging Face model id. Default is Stable Diffusion 1.5 (fits ~4 GB of free VRAM).
      - IMAGEGEN_MODEL=${IMAGEGEN_MODEL:-stable-diffusion-v1-5/stable-diffusion-v1-5}
      # Seconds idle before the model is dropped from VRAM (0 = keep loaded).
      - IMAGEGEN_KEEP_ALIVE=${IMAGEGEN_KEEP_ALIVE:-120}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  ollama_models:
  hf_cache:
